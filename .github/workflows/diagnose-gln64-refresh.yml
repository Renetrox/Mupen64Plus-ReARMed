name: Diagnose refreshed glN64 validation

on:
  push:
    branches: [gln64-fz-refresh-final]
    paths: [.github/workflows/diagnose-gln64-refresh.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gln64-fz-refresh-final
      - name: Print validation state
        shell: bash
        run: |
          set +e
          echo "glide_count=$(grep -c 'CORE_NAME \"-glide64-' libretro/libretro_core_options_base.h)"
          echo "gln_count=$(grep -c 'CORE_NAME \"-gln64-' libretro/libretro_core_options_base.h)"
          for spec in \
            'libretro/libretro_core_options_base.h|Enable or disable N64 fog emulation' \
            'libretro/libretro_core_options_base.h|Read the framebuffer every frame. This is slow' \
            'libretro/libretro_core_options_base.h|No more than 5 frames' \
            'libretro/libretro_core_options.h|Advanced core timing controls' \
            'libretro/libretro.c|parallel-n64-count-per-op' \
            'libretro/libretro.c|CORE_NAME "-gln64-screen-clear"' \
            'gles2n64/src/gles2N64.c|GLN64_FRAMESKIP_AUTO_MIN (-5)'
          do
            f="${spec%%|*}"; p="${spec#*|}"
            if grep -Fq "$p" "$f"; then echo "PASS $f :: $p"; else echo "FAIL $f :: $p"; fi
          done
          exit 0
