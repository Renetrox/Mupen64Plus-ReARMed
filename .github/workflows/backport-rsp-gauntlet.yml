name: Backport RSP Gauntlet fixes

on:
  push:
    branches:
      - frameskip-modern
    paths:
      - .github/workflows/backport-rsp-gauntlet.yml

permissions:
  contents: write

jobs:
  backport:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frameskip-modern
        uses: actions/checkout@v4
        with:
          ref: frameskip-modern
          fetch-depth: 0

      - name: Cherry-pick upstream RSP series
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add parallel-upstream https://github.com/libretro/parallel-n64.git
          git fetch --no-tags parallel-upstream 5f58ab259cd60fba58f4447fefe2ffc873134804
          git cherry-pick -x 8f1efe5813583ddffd4221efa55735febe34719d
          git cherry-pick -x b8fef17ae336ea2c1b1a56195f685cac3b482db9
          git cherry-pick -x 57261d36b4a16b0a98bae452e6746fa9080bb011
          git cherry-pick -x 5f58ab259cd60fba58f4447fefe2ffc873134804

          git diff --check HEAD~4 HEAD
          grep -F 'clear_rcp_interrupt(sp->mi, MI_INTR_SP);' mupen64plus-core/src/device/rcp/rsp/rsp_core.c
          grep -F 'remove_event(&sp->mi->r4300->cp0.q, CHECK_INT);' mupen64plus-core/src/device/rcp/rsp/rsp_core.c
          grep -F 'if (!l_streaming_gfx_running || (*dmem_u32(hle, TASK_FLAGS) & 1))' mupen64plus-rsp-hle/src/hle.c
          if grep -Fq '(!strcmp((const char*)ROM_HEADER.Name, "GAUNTLET LEGENDS"))' libretro/libretro.c; then
            echo 'Gauntlet hardcoded CXD4 route still present' >&2
            exit 1
          fi
          git log --oneline -4

      - name: Remove helper and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/backport-rsp-gauntlet.yml
          git add .github/workflows/backport-rsp-gauntlet.yml
          git commit -m 'ci: remove temporary RSP backport helper'
          git push origin HEAD:frameskip-modern
