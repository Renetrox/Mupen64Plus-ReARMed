name: Final build refreshed glN64 branch

on:
  push:
    branches: [gln64-fz-refresh-final]
    paths: [.github/workflows/final-build-gln64-refresh.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gln64-fz-refresh-final
          fetch-depth: 0

      - name: Normalize integrated blocks
        shell: bash
        run: |
          set -euo pipefail
          awk '/python3 - <<'\''PY'\''/{flag=1;next} /^          PY$/{flag=0;exit} flag{sub(/^          /,""); print}' \
            .github/workflows/validate-gln64-refresh.yml > /tmp/normalize.py
          python3 /tmp/normalize.py
          git diff --check

      - name: Validate option sets
        shell: bash
        run: |
          set -euo pipefail
          [ "$(grep -c 'CORE_NAME \"-glide64-' libretro/libretro_core_options_base.h)" -eq 29 ]
          [ "$(grep -c 'CORE_NAME \"-gln64-' libretro/libretro_core_options_base.h)" -eq 4 ]
          grep -Fq 'Enable or disable N64 fog emulation' libretro/libretro_core_options_base.h
          grep -Fq 'Read the framebuffer every frame. This is slow' libretro/libretro_core_options_base.h
          grep -Fq 'No more than 5 frames' libretro/libretro_core_options_base.h
          grep -Fq 'Advanced core timing controls' libretro/libretro_core_options.h
          grep -Fq 'parallel-n64-count-per-op' libretro/libretro.c
          grep -Fq 'CORE_NAME "-gln64-screen-clear"' libretro/libretro.c
          grep -Fq 'GLN64_FRAMESKIP_AUTO_MIN (-5)' gles2n64/src/gles2N64.c

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential pkg-config \
            libgl-dev libgl1-mesa-dev libegl-dev libegl1-mesa-dev \
            libgles2-mesa-dev

      - name: Compile core
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j2

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libretro/libretro.c libretro/libretro_core_options_base.h gles2n64/src/gles2N64.c
          if ! git diff --cached --quiet; then
            git commit -m "Clean up refreshed glN64 integration"
            git push origin HEAD:gln64-fz-refresh-final
          fi
