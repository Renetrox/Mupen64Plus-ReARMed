name: Build ReARMed libretro core

on:
  pull_request:
    branches: [frameskip-modern]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        render: [opengl, gles]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev zlib1g-dev nasm
      - name: Build core
        run: |
          if [ "${{ matrix.render }}" = "gles" ]; then
            make -j2 FORCE_GLES=1
          else
            make -j2
          fi
          test -s mupen64plus_rearmed_libretro.so
