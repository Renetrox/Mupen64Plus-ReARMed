name: Fix Glide64 FZ frameskip regression

on:
  push:
    branches:
      - frameskip-modern

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frameskip-modern
          fetch-depth: 0

      - name: Restore FZ frameskip bridge
        env:
          OLD_LIB: 
          NEW_LIB: 
          OLD_OPT: 
          NEW_OPT: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          pairs = [
              ('libretro/libretro.c', 'OLD_LIB', 'NEW_LIB'),
              ('libretro/libretro_core_options_base.h', 'OLD_OPT', 'NEW_OPT'),
          ]
          for filename, oldkey, newkey in pairs:
              path = Path(filename)
              text = path.read_text()
              old = base64.b64decode(os.environ[oldkey]).decode()
              new = base64.b64decode(os.environ[newkey]).decode()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected exactly one regression block, found {count}')
              path.write_text(text.replace(old, new, 1))
          assert 'GLIDE64_FRAMESKIP_AUTO, -mode' in Path('libretro/libretro.c').read_text()
          opts = Path('libretro/libretro_core_options_base.h').read_text()
          assert '{ "-5", "No more than 5 frames" }' in opts
          assert '{ "5",  "Exactly 5 frames" }' in opts
          PY

      - name: Remove temporary workflow and commit clean fix
        run: |
          git rm .github/workflows/fix-glide64-fz-frameskip-regression.yml
          git add libretro/libretro.c libretro/libretro_core_options_base.h
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "glide64: restore complete FZ frameskip semantics"
          git push origin HEAD:frameskip-modern
