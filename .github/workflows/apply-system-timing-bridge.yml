name: Apply system timing bridge fix

on:
  push:
    branches:
      - glide64-system-timing-final

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply system timing bridge fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply bridge fix
        run: python3 tools/fix-system-timing-bridge.py

      - name: Validate diff
        run: git diff --check

      - name: Commit materialized fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libretro/libretro.c \
                  libretro/libretro_private.h \
                  mupen64plus-core/src/main/main.c
          git rm .github/workflows/apply-system-timing-bridge.yml
          git commit -m "Fix system timing libretro bridge"
          git push
