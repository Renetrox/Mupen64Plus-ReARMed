name: Build Glide64 system timing branch

on:
  push:
    branches:
      - glide64-system-timing-final

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Run Glide64/system timing build check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Build
        run: |
          make clean
          make -j2

      - name: Remove temporary workflow after success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-glide64-system-timing.yml
          git commit -m "Remove successful temporary build check"
          git push
