name: Validate refreshed glN64 branch

on:
  push:
    branches: [gln64-fz-refresh-final]
    paths: [.github/workflows/validate-gln64-refresh.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gln64-fz-refresh-final
          fetch-depth: 0

      - name: Normalize integrated option code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Clean the native glN64 frameskip parser formatting.
          p=Path('libretro/libretro.c'); s=p.read_text()
          a=s.index('      /* Backward compatibility with older ReARMed option strings. */')
          b=s.index('      retro_gles2n64_frameskip_mode = mode;',a)
          block='''      /* Backward compatibility with older ReARMed option strings. */
              if (!strcmp(var.value, "auto"))
                 mode = -2;
              else if (!strcmp(var.value, "disabled"))
                 mode = 0;
              else
                 mode = atoi(var.value);

              if (mode < -5)
                 mode = -5;
              if (mode > 5)
                 mode = 5;

          '''
          s=s[:a]+block+s[b:]; p.write_text(s)

          # Clean renderer scheduler formatting.
          p=Path('gles2n64/src/gles2N64.c'); s=p.read_text()
          a=s.index('   if (mode < GLN64_FRAMESKIP_AUTO_MIN)')
          b=s.index('\n}\n\nstatic int gln64_frameskip_will_skip_next',a)
          block='''   if (mode < GLN64_FRAMESKIP_AUTO_MIN)
              mode = GLN64_FRAMESKIP_AUTO_MIN;
           if (mode > 5)
              mode = 5;

           if (gln64_frame_skipper.mode != mode)
           {
              gln64_frame_skipper.mode = mode;
              gln64_frame_skipper.max_skips =
                 (mode < 0) ? -mode : ((mode > 0) ? mode : 0);
              gln64_frameskip_start();
           }'''
          s=s[:a]+block+s[b:]; p.write_text(s)

          # Normalize the five glN64 Core Option objects as one readable block.
          p=Path('libretro/libretro_core_options_base.h'); s=p.read_text()
          def objrange(text,key):
              pos=text.index(f'CORE_NAME "{key}"'); start=text.rfind('\n    {',0,pos)+1
              depth=0; ins=False; esc=False
              for i in range(start,len(text)):
                  ch=text[i]
                  if ins:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': ins=False
                      continue
                  if ch=='"': ins=True
                  elif ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          end=i+1
                          if end<len(text) and text[end]==',': end+=1
                          return start,end
              raise RuntimeError(key)
          a,_=objrange(s,'-gles2n64-frameskip'); _,b=objrange(s,'-gln64-z-hack')
          block='''    {
              CORE_NAME "-gles2n64-frameskip",
              "gles2n64 Frame Skip",
              "Frame Skip",
              "Native Mupen64Plus FZ frameskip. Negative values use automatic catch-up with the selected maximum consecutive skips; positive values skip exactly that many graphics frames after each rendered frame. This renderer-specific mode takes precedence over the global Frame Skip option.",
              NULL,
              "gles2n64",
              {
                  { "0",  "Never skip frames" },
                  { "-1", "No more than 1 frame" },
                  { "-2", "No more than 2 frames" },
                  { "-3", "No more than 3 frames" },
                  { "-4", "No more than 4 frames" },
                  { "-5", "No more than 5 frames" },
                  { "1",  "Exactly 1 frame" },
                  { "2",  "Exactly 2 frames" },
                  { "3",  "Exactly 3 frames" },
                  { "4",  "Exactly 4 frames" },
                  { "5",  "Exactly 5 frames" },
                  { NULL, NULL },
              },
              "0"
          },
          {
              CORE_NAME "-gln64-fog",
              "gles2n64: Fog",
              "Fog",
              "Enable N64 fog in the legacy gles2n64/glN64 renderer. Mupen64Plus FZ defaults this renderer option to Off. Restart content after changing for deterministic shader state.",
              NULL,
              "gles2n64",
              {
                  { "disabled", "Disabled" },
                  { "enabled", "Enabled" },
                  { NULL, NULL },
              },
              "disabled"
          },
          {
              CORE_NAME "-gln64-alpha-test",
              "gles2n64: Alpha Test",
              "Alpha Test",
              "Enable glN64 alpha testing using the same threshold/cvgXAlpha decision used by Mupen64Plus FZ. Disabling can improve speed but may break transparency.",
              NULL,
              "gles2n64",
              {
                  { "enabled", "Enabled" },
                  { "disabled", "Disabled" },
                  { NULL, NULL },
              },
              "enabled"
          },
          {
              CORE_NAME "-gln64-screen-clear",
              "gles2n64: Force Screen Clear",
              "Force Screen Clear",
              "FZ-style post-swap color/depth clear adapted for libretro. Because retro_return() only latches a frame, the clear is deferred until the next display list so the frame is not erased before RetroArch presents it. Restart content after changing.",
              NULL,
              "gles2n64",
              {
                  { "disabled", "Disabled" },
                  { "enabled", "Enabled" },
                  { NULL, NULL },
              },
              "disabled"
          },
          {
              CORE_NAME "-gln64-z-hack",
              "gles2n64: Z Hack",
              "Z Hack",
              "Enable the legacy glN64 depth transform used by Mupen64Plus FZ. Intended only for games that need it; changing it requires restarting content because the vertex shader is compiled at renderer startup.",
              NULL,
              "gles2n64",
              {
                  { "disabled", "Disabled" },
                  { "enabled", "Enabled" },
                  { NULL, NULL },
              },
              "disabled"
          },'''
          s=s[:a]+block+s[b:]; p.write_text(s)
          PY

          git diff --check
          grep -q 'Advanced core timing controls' libretro/libretro_core_options.h
          test "$(grep -c 'CORE_NAME \"-glide64-' libretro/libretro_core_options_base.h)" -ge 29
          test "$(grep -c 'CORE_NAME \"-gln64-' libretro/libretro_core_options_base.h)" -eq 4
          ! grep -q 'Controla la' libretro/libretro_core_options_base.h
          ! grep -q 'Activa la' libretro/libretro_core_options_base.h
          grep -q 'No more than 5 frames' libretro/libretro_core_options_base.h
          grep -q 'parallel-n64-count-per-op' libretro/libretro.c
          grep -q 'CORE_NAME "-gln64-screen-clear"' libretro/libretro.c

      - name: Compile core
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libegl1-mesa-dev
          make clean
          make -j2

      - name: Commit normalization
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libretro/libretro.c libretro/libretro_core_options_base.h gles2n64/src/gles2N64.c
          if ! git diff --cached --quiet; then
            git commit -m "Clean up refreshed glN64 integration"
            git push origin HEAD:gln64-fz-refresh-final
          fi
