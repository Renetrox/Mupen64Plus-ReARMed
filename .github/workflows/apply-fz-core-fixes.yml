name: Validate FZ core safety fixes

on:
  push:
    branches:
      - frameskip-modern
    paths:
      - .github/workflows/apply-fz-core-fixes.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frameskip-modern
        uses: actions/checkout@v4
        with:
          ref: frameskip-modern

      - name: Build libretro core
        shell: bash
        run: |
          set -euo pipefail
          make -j2
