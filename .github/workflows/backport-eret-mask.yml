name: Backport ERET 64-bit mask fix

on:
  push:
    branches:
      - frameskip-modern
    paths:
      - .github/workflows/backport-eret-mask.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frameskip-modern
        uses: actions/checkout@v4
        with:
          ref: frameskip-modern

      - name: Apply upstream ERET mask fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mupen64plus-core/src/device/r4300/new_dynarec/new_dynarec.c')
          text = path.read_text()
          old = '''        for(int i=0;i<32;i++)
            is64 = (((int)(state->regs[i]>>32)^((int)state->regs[i]>>31))!=0)<<i;'''
          new = '''        for(int i=0;i<32;i++)
            is64 |= (((int)(state->regs[i]>>32)^((int)state->regs[i]>>31))!=0)<<i;'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one ERET mask pattern, found {count}')

          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          grep -A3 -B2 'uint32_t is64 = 0;' mupen64plus-core/src/device/r4300/new_dynarec/new_dynarec.c

      - name: Build core
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev
          make -j2

      - name: Commit verified backport and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/backport-eret-mask.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mupen64plus-core/src/device/r4300/new_dynarec/new_dynarec.c .github/workflows/backport-eret-mask.yml
          git commit -m 'new_dynarec: accumulate the 64-bit register mask in ERET_new' -m 'Backport libretro/parallel-n64 edc87b416abcfa4cb99360bcd46162f0a76ffb85. Preserve live 64-bit register flags across ERET instead of overwriting the mask on every loop iteration.'
          git push origin HEAD:frameskip-modern
