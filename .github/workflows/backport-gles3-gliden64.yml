name: Backport GLideN64 GLES3 support

on:
  push:
    branches:
      - frameskip-modern
    paths:
      - .github/workflows/backport-gles3-gliden64.yml

permissions:
  contents: write

jobs:
  backport:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frameskip-modern
        uses: actions/checkout@v4
        with:
          ref: frameskip-modern
          fetch-depth: 0

      - name: Apply GLES3 support to ReARMed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {n}')
              p.write_text(s.replace(old, new))

          replace_exact(
              'libretro-common/include/glsym/glsym_es3.h',
              '''#ifdef GL_APIENTRY\ntypedef void (GL_APIENTRY *RGLGENGLDEBUGPROC)(GLenum, GLenum, GLuint, GLenum, GLsizei, const GLchar*, GLvoid*);\ntypedef void (GL_APIENTRY *RGLGENGLDEBUGPROCKHR)(GLenum, GLenum, GLuint, GLenum, GLsizei, const GLchar*, GLvoid*);\n#else\n#ifndef APIENTRY\n#define APIENTRY\n#endif\n#ifndef APIENTRYP\n#define APIENTRYP APIENTRY *\n#endif\n''',
              '''#ifndef APIENTRY\n#define APIENTRY\n#endif\n#ifndef APIENTRYP\n#define APIENTRYP APIENTRY *\n#endif\n#ifdef GL_APIENTRY\ntypedef void (GL_APIENTRY *RGLGENGLDEBUGPROC)(GLenum, GLenum, GLuint, GLenum, GLsizei, const GLchar*, GLvoid*);\ntypedef void (GL_APIENTRY *RGLGENGLDEBUGPROCKHR)(GLenum, GLenum, GLuint, GLenum, GLsizei, const GLchar*, GLvoid*);\n#else\n''')

          replace_exact(
              'Makefile.common',
              '''# GLideN64 needs OpenGL 3.3 Core or OpenGL ES 3.x (UBOs, integer textures,\n# glcorearb.h, etc.) and does not work on GLES2-only targets. The Makefile's\n# GLES=1 switch maps to -DHAVE_OPENGLES2 with no GLES3 path, so force it off\n# there. Other GLES2-only configurations should also unset HAVE_GLIDEN64.\nifeq ($(GLES),1)\n\tHAVE_GLIDEN64 = 0\nendif\n''',
              '''# GLideN64 needs OpenGL 3.3 Core or OpenGL ES 3.x (UBOs, integer textures,\n# glcorearb.h, etc.) and does not work on GLES2-only targets. GLES=1 maps to\n# -DHAVE_OPENGLES2, so force it off there. GLES3=1 selects the GLES 3.x path\n# below and does satisfy GLideN64, so it is left enabled in that case.\nifeq ($(GLES),1)\nifneq ($(GLES3),1)\n\tHAVE_GLIDEN64 = 0\nendif\nendif\n''')

          replace_exact(
              'Makefile.common',
              '''ifeq ($(HAVE_OPENGL),1)\nifeq ($(GLES),1)\n\tGLFLAGS += -DHAVE_OPENGLES -DHAVE_OPENGLES2 -DDISABLE_3POINT\n\tSOURCES_C += $(LIBRETRO_COMM_DIR)/glsym/glsym_es2.c\nelse\n''',
              '''ifeq ($(HAVE_OPENGL),1)\nifeq ($(GLES3),1)\n\t# GLES 3.x path. HAVE_OPENGLES3 makes glsm request a GLES3 context and\n\t# enables the GLES3 wrappers in glsm.c; without it they compile to stubs.\n\tGLFLAGS += -DHAVE_OPENGLES -DHAVE_OPENGLES3 -DDISABLE_3POINT\n\tSOURCES_C += $(LIBRETRO_COMM_DIR)/glsym/glsym_es3.c\nelse ifeq ($(GLES),1)\n\tGLFLAGS += -DHAVE_OPENGLES -DHAVE_OPENGLES2 -DDISABLE_3POINT\n\tSOURCES_C += $(LIBRETRO_COMM_DIR)/glsym/glsym_es2.c\nelse\n''')

          replace_exact(
              'mupen64plus-video-gliden64/src/Graphics/OpenGLContext/GLFunctions.h',
              '''#ifdef EGL\n#include <GL/glcorearb.h>\n#include <EGL/egl.h>\n#include <EGL/eglext.h>\n#elif defined(OS_MAC_OS_X)\n''',
              '''#ifdef EGL\n#include <GL/glcorearb.h>\n#include <EGL/egl.h>\n#include <EGL/eglext.h>\n#elif defined(HAVE_OPENGLES3)\n/* Desktop <GL/gl.h> must stay out: it declares glEnable and friends as real\n * functions, and glsmsym.h has already turned those names into macros.\n * Pull GLES headers in before the glX -> g_glX aliases below. */\n#include <glsym/rglgen_headers.h>\n#include <GL/glcorearb.h>\n#elif defined(OS_MAC_OS_X)\n''')

          base = Path('libretro/libretro_core_options_base.h')
          s = base.read_text()
          old = '''        CORE_NAME "-gliden64-EnableFragmentDepthWrite",\n        "GPU shader depth write",\n        NULL,\n        "(GLideN64) Enable writing of fragment depth. Some mobile GPUs do not support it, thus it's optional. Leave enabled.",\n        "Enable writing of fragment depth. Some mobile GPUs do not support it, thus it's optional. Leave enabled.",\n        "gliden64",\n        {\n            {"False", NULL},\n            {"True", NULL},\n            { NULL, NULL },\n        },\n#ifdef HAVE_OPENGLES\n        "False"\n#else\n        "True"\n#endif\n'''
          new = old.replace('#ifdef HAVE_OPENGLES\n        "False"', '#ifdef HAVE_OPENGLES2\n        "False"')
          if s.count(old) != 1:
              raise SystemExit(f'libretro_core_options_base.h: fragment-depth block count={s.count(old)}')
          base.write_text(s.replace(old, new))

          replace_exact(
              'libretro-common/glsm/glsm.c',
              '#if !defined(HAVE_OPENGLES) || defined(HAVE_OPENGLES) && defined(HAVE_OPENGLES_3_1)\n   glProgramBinary(program, binaryFormat, binary, length);',
              '#if !defined(HAVE_OPENGLES) || defined(HAVE_OPENGLES) && (defined(HAVE_OPENGLES3) || defined(HAVE_OPENGLES_3_1))\n   glProgramBinary(program, binaryFormat, binary, length);')

          # ReARMed still carries the duplicate-prefix key fixed upstream by
          # a91f51e. Fix the key and expose it on GLES3 (beed083b) in one block.
          replace_exact(
              'libretro/libretro.c',
              '''   var.key = CORE_NAME "-gliden64-gliden64-EnableShadersStorage";\n   var.value = NULL;\n   if (environ_cb(RETRO_ENVIRONMENT_GET_VARIABLE, &var) && var.value)\n   {\n      EnableShadersStorage = !strcmp(var.value, "False") ? 0 : 1;\n   }\n''',
              '''#if !defined(VC) && !defined(HAVE_OPENGLES2)\n   var.key = CORE_NAME "-gliden64-EnableShadersStorage";\n   var.value = NULL;\n   if (environ_cb(RETRO_ENVIRONMENT_GET_VARIABLE, &var) && var.value)\n   {\n      EnableShadersStorage = !strcmp(var.value, "False") ? 0 : 1;\n   }\n#endif\n''')

          replace_exact(
              'libretro/libretro_core_options_base.h',
              '#if !defined(VC) && !defined(HAVE_OPENGLES)\n    {\n        CORE_NAME "-gliden64-EnableShadersStorage",',
              '#if !defined(VC) && !defined(HAVE_OPENGLES2)\n    {\n        CORE_NAME "-gliden64-EnableShadersStorage",')
          PY

          git diff --check
          git add Makefile.common \
            libretro-common/include/glsym/glsym_es3.h \
            libretro-common/glsm/glsm.c \
            libretro/libretro.c \
            libretro/libretro_core_options_base.h \
            mupen64plus-video-gliden64/src/Graphics/OpenGLContext/GLFunctions.h
          git commit -m 'gliden64: add GLES3 build path for SBC targets' \
            -m 'Backport current parallel-n64 GLES3 enablement and shader-cache fixes (6d5fa8b, b9fcff1, c7189c5, a91f51e, fd775343, beed083b) onto ReARMed while preserving the GLES2 path and fork-specific option wrapper.'

          grep -F 'ifeq ($(GLES3),1)' Makefile.common
          grep -F -- '-DHAVE_OPENGLES -DHAVE_OPENGLES3' Makefile.common
          grep -F 'glsym_es3.c' Makefile.common
          grep -F '#elif defined(HAVE_OPENGLES3)' mupen64plus-video-gliden64/src/Graphics/OpenGLContext/GLFunctions.h
          grep -F 'CORE_NAME "-gliden64-EnableShadersStorage"' libretro/libretro.c
          grep -F 'defined(HAVE_OPENGLES3) || defined(HAVE_OPENGLES_3_1)' libretro-common/glsm/glsm.c

      - name: Probe GLES3 build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev
          make clean >/dev/null 2>&1 || true
          set +e
          make GLES3=1 -j2 > /tmp/gles3-build.log 2>&1
          rc=$?
          set -e
          cat /tmp/gles3-build.log
          compile_errors=$(grep -E '(fatal error:|error:)' /tmp/gles3-build.log | grep -v 'collect2: error: ld returned' || true)
          if [ -n "$compile_errors" ]; then
            echo "$compile_errors" >&2
            echo 'GLES3 compile error detected.' >&2
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo 'Source compilation was clean; build stopped at the repository existing final-link issue.'
          fi

      - name: Remove helper and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/backport-gles3-gliden64.yml
          git add .github/workflows/backport-gles3-gliden64.yml
          git commit -m 'ci: remove temporary GLideN64 GLES3 backport helper'
          git push origin HEAD:frameskip-modern
